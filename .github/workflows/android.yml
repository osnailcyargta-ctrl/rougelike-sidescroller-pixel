name: Build APK

# The APK is a snapshot: whatever the game looks like at the ref it is told to
# take, packaged so it runs with no network at all.
on:
  push:
    branches: [ 'claude/android-apk' ]
    paths: [ 'android/**', '.github/workflows/android.yml' ]
  workflow_dispatch:
    inputs:
      game_ref:
        description: 'Branch, tag or SHA of the game to package (blank = the web branch)'
        required: false
        default: ''

env:
  # Where the game itself lives. The app follows this branch at runtime, so the
  # bundle inside the APK is packaged from it too - the two can never disagree
  # about which game this is.
  WEB_BRANCH: claude/roguelike-pixel-sidescroller-nmg0i5

jobs:
  build:
    runs-on: ubuntu-latest
    # The whole job takes about a minute and a half. Anything past ten means
    # something is stuck, and a stuck job should fail rather than sit there.
    timeout-minutes: 20
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The packaged copy always comes from the web branch, not from this one.
      # Nothing has to be merged here for an APK to carry the current game.
      - name: Take the game from the web branch
        run: |
          set -euo pipefail
          REF="${{ inputs.game_ref }}"
          [ -n "$REF" ] || REF="$WEB_BRANCH"
          git fetch --depth=1 origin "$REF"
          git checkout FETCH_HEAD -- index.html js css shaders
          echo "GAME_REF=$REF" >> "$GITHUB_ENV"
          echo "GAME_SHA=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Work out the version
        run: |
          set -euo pipefail
          SHA="${GAME_SHA:-$(git rev-parse --short HEAD)}"
          CODE="$(git rev-list --count HEAD)"
          echo "GAME_SHA=$SHA" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(date -u +%Y.%m.%d)-$SHA" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Snapshot the game into the app
        run: bash android/snapshot.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug assembleRelease \
            -PgameVersion="$VERSION_NAME" \
            -PgameCode="$VERSION_CODE"

      - name: Name the outputs
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/aether-descent-$VERSION_NAME-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/aether-descent-$VERSION_NAME.apk"
          ls -lh out

      # Proof the thing actually contains a playable game, not an empty shell.
      - name: Check the bundle made it in
        run: |
          set -euo pipefail
          APK="out/aether-descent-$VERSION_NAME.apk"
          unzip -l "$APK" > /tmp/apk.txt
          for f in assets/www/index.html assets/www/js/game.js assets/www/js/poitnus.js assets/www/css/style.css; do
            grep -q "$f" /tmp/apk.txt || { echo "missing from the APK: $f"; exit 1; }
          done
          COUNT=$(grep -c 'assets/www/' /tmp/apk.txt)
          echo "$COUNT game files packaged"
          [ "$COUNT" -ge 25 ] || { echo "too few files packaged"; exit 1; }
          # The updater must follow the web branch, not this one: an APK that
          # updates from its own branch stops seeing the game change.
          grep -q 'claude/roguelike-pixel-sidescroller-nmg0i5' \
            android/app/src/main/java/com/aetherdescent/game/GameUpdater.java \
            || { echo "the updater is not pointed at the web branch"; exit 1; }
          # The game is ES modules. Loading them from file:// is blocked by
          # CORS, which is what left the first build stuck on "click to
          # start", so the app must not be pointed at file:// again.
          if grep -rn 'file:///android_asset' android/app/src/main/java/; then
            echo "the app is loading from file:// - modules will not run"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aether-descent-apk-${{ env.VERSION_NAME }}
          path: out/*.apk
          if-no-files-found: error
