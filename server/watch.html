<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascent to the Aether - lobbies</title>
<style>
  :root {
    --bg: #0a0c14; --panel: #121626; --line: #232a44;
    --ink: #dfe6ff; --dim: #7a86ad; --hot: #ff7a6a; --ok: #8fd94a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .04em;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 2;
  }
  h1 { font-size: 14px; margin: 0; color: var(--hot); letter-spacing: .12em; }
  .spacer { flex: 1; }
  .pill {
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    color: var(--dim); white-space: nowrap;
  }
  .pill.shut { color: var(--hot); border-color: var(--hot); }
  .pill.open { color: var(--ok); border-color: #2f4a1e; }
  label { color: var(--dim); }
  input, button, select {
    font: inherit; background: #0d1120; color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--hot); }

  #gate { max-width: 380px; margin: 12vh auto; padding: 22px; border: 1px solid var(--line);
          border-radius: 8px; background: var(--panel); }
  #gate h2 { margin: 0 0 6px; font-size: 15px; letter-spacing: .1em; }
  #gate p { color: var(--dim); margin: 0 0 16px; }
  #gate form { display: flex; gap: 8px; }
  #gate input { flex: 1; }
  #err { color: var(--hot); min-height: 1.5em; margin-top: 10px; }

  main { padding: 16px; display: grid; gap: 16px;
         grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); }
  .lobby { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
  .lobby > h3 { margin: 0; padding: 9px 12px; font-size: 13px; letter-spacing: .08em;
                border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; }
  .lobby .tag { margin-left: auto; color: var(--dim); font-size: 11px; }
  .lobby .tag.live { color: var(--hot); }
  .seats { display: grid; grid-template-columns: 1fr 1fr; }
  .seat { padding: 8px; border-right: 1px solid var(--line); }
  .seat:last-child { border-right: 0; }
  .seat .who { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-bottom: 6px; }
  .seat .who b { color: var(--ink); font-weight: 500; }
  .screen {
    width: 100%; aspect-ratio: 16 / 9; background: #05060c; border: 1px solid var(--line);
    border-radius: 3px; display: block; image-rendering: pixelated; object-fit: cover;
  }
  .waiting { width: 100%; aspect-ratio: 16 / 9; background: #05060c; border: 1px dashed var(--line);
             border-radius: 3px; display: grid; place-items: center; color: var(--dim); font-size: 11px; }
  #empty { color: var(--dim); padding: 40px 16px; text-align: center; grid-column: 1 / -1; }
</style>
</head>
<body>

<div id="gate">
  <h2>LOBBY WATCH</h2>
  <p>This is the duel server for Ascent to the Aether. The password is not the game's.</p>
  <form id="gateform">
    <input id="pass" type="password" autocomplete="current-password" placeholder="PASSWORD" autofocus>
    <button type="submit">OPEN</button>
  </form>
  <div id="err"></div>
</div>

<header hidden id="bar">
  <h1>LOBBY WATCH</h1>
  <span class="pill" id="count">-</span>
  <span class="pill" id="door">-</span>
  <span class="spacer"></span>
  <label for="fps">FRAMES</label>
  <select id="fps"></select>
  <span class="pill" id="ping">-</span>
</header>
<main hidden id="grid"></main>

<script>
// The watch page. It holds one socket, says the password down it, and from
// then on draws whatever the server pushes: a list of lobbies, and pictures of
// the screens inside them.
//
// The pictures cost the players bandwidth, so this asks for a rate and the
// server passes that on - nobody sends anything while nobody is looking.

const $ = (id) => document.getElementById(id);
const gate = $('gate'), bar = $('bar'), grid = $('grid');

const wsUrl = () => (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/watch';

let sock = null;
let frames = new Map();      // seat key -> the <img> showing it
let lastList = [];

for (let n = 10; n <= 30; n += 5) {
  const o = document.createElement('option');
  o.value = String(n);
  o.textContent = n + ' FPS';
  $('fps').append(o);
}
$('fps').value = '15';
$('fps').onchange = () => send({ t: 'fps', n: Number($('fps').value) });

function send(o) { if (sock && sock.readyState === 1) sock.send(JSON.stringify(o)); }

$('gateform').onsubmit = (e) => {
  e.preventDefault();
  $('err').textContent = '';
  open($('pass').value);
};

function open(pass) {
  if (sock) { try { sock.close(); } catch {} }
  sock = new WebSocket(wsUrl());
  sock.onopen = () => send({ t: 'watch', pass, fps: Number($('fps').value) });
  sock.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.t === 'denied') { $('err').textContent = m.why || 'NO'; try { sock.close(); } catch {} return; }
    if (m.t === 'watching') {
      gate.hidden = true; bar.hidden = false; grid.hidden = false;
      // keep it, so a reload does not mean typing it again on a home network
      try { sessionStorage.setItem('aether.watch.pass', pass); } catch {}
      setInterval(() => send({ t: 'ping', at: Date.now() }), 3000);
      return;
    }
    if (m.t === 'pong') { $('ping').textContent = (Date.now() - m.at) + 'MS'; return; }
    if (m.t === 'wlobbies') { render(m.list, m.door); return; }
    if (m.t === 'wframe') {
      const img = frames.get(m.key);
      if (img) { img.src = m.img; img.dataset.cold = ''; }
      return;
    }
  };
  sock.onclose = () => {
    if (!bar.hidden) {
      $('ping').textContent = 'GONE';
      // the server may simply have been restarted; come back on its own
      setTimeout(() => { const p = sessionStorage.getItem('aether.watch.pass'); if (p) open(p); }, 3000);
    }
  };
}

function render(list, door) {
  $('count').textContent = list.length + (list.length === 1 ? ' LOBBY' : ' LOBBIES');
  if (door) {
    $('door').textContent = door.now + ' ' + (door.tz || '') + ' - ' + door.message;
    $('door').className = 'pill ' + (door.open ? 'open' : 'shut');
  }
  // Rebuild only when the shape changed; otherwise the <img> elements would be
  // thrown away twice a second and every screen would flicker.
  const sig = JSON.stringify(list.map((l) => [l.id, l.name, l.started, l.seats.map((s) => s.key + s.name)]));
  if (sig === lastList) return;
  lastList = sig;

  grid.textContent = '';
  frames = new Map();
  if (!list.length) {
    const p = document.createElement('div');
    p.id = 'empty';
    p.textContent = door && !door.open
      ? 'THE SERVER IS SHUT UNTIL ' + door.opensAt + '. NOBODY CAN OPEN A LOBBY.'
      : 'NOBODY IS IN A LOBBY RIGHT NOW.';
    grid.append(p);
    return;
  }

  for (const l of list) {
    const card = document.createElement('section');
    card.className = 'lobby';
    const h = document.createElement('h3');
    h.textContent = l.name;
    const tag = document.createElement('span');
    tag.className = 'tag' + (l.started ? ' live' : '');
    tag.textContent = l.started ? 'FIGHTING' : 'WAITING';
    h.append(tag);
    card.append(h);

    const seats = document.createElement('div');
    seats.className = 'seats';
    for (let i = 0; i < 2; i++) {
      const s = l.seats[i];
      const cell = document.createElement('div');
      cell.className = 'seat';
      const who = document.createElement('div');
      who.className = 'who';
      const b = document.createElement('b');
      b.textContent = s ? s.name : '-';
      who.append(b);
      const role = document.createElement('span');
      role.textContent = s ? s.role : (i ? 'EMPTY' : '');
      who.append(role);
      cell.append(who);
      if (s) {
        // A one-pixel transparent GIF holds the box open until the first
        // real frame lands, so the grid does not jump when it does.
        const img = document.createElement('img');
        img.className = 'screen';
        img.alt = s.name + "'s screen";
        img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
        cell.append(img);
        frames.set(s.key, img);
      } else {
        const box = document.createElement('div');
        box.className = 'waiting';
        box.textContent = 'NO CHALLENGER';
        cell.append(box);
      }
      seats.append(cell);
    }
    card.append(seats);
    grid.append(card);
  }
}

// a password already typed this session gets you straight back in
try {
  const p = sessionStorage.getItem('aether.watch.pass');
  if (p) open(p);
} catch {}
</script>
</body>
</html>
