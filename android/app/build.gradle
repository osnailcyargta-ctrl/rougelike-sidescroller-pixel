plugins {
  id 'com.android.application'
}

// The build stamps in what it packaged. -PgameVersion / -PgameCode come from
// CI, which derives them from the commit it snapshotted; a local build without
// them still works and says so.
def gameVersion = project.findProperty('gameVersion') ?: 'dev'
def gameCode = (project.findProperty('gameCode') ?: '1') as Integer

android {
  namespace 'com.aetherdescent.game'
  compileSdk 34

  defaultConfig {
    applicationId 'com.aetherdescent.game'
    minSdk 26
    targetSdk 34
    versionCode gameCode
    versionName gameVersion
  }

  // One key, kept in the repository, used for every build.
  //
  // Gradle's own debug key is generated per machine, and a CI runner is a new
  // machine every time - so every build came out signed by a different key and
  // Android refused to install it over the last one. That meant uninstalling,
  // and uninstalling takes the player's settings, their saved shaders and the
  // Boss Rush unlock with it. A fixed key means every future build installs
  // straight over the one before it and keeps all of that.
  //
  // It is a self-signed key sitting in a public repo, so it proves nothing
  // about who built the APK: anyone with the repository can sign something
  // that Android will accept as an update to this app. That is the trade for
  // not wiping the player's data, and it is fine for a game handed around as
  // a file. Publishing anywhere real means a key that is NOT in here - point
  // storeFile at a secret and this build keeps working.
  signingConfigs {
    ascent {
      storeFile file(project.findProperty('ascentKeystore') ?: '../keys/ascent.jks')
      storePassword project.findProperty('ascentStorePassword') ?: 'ascent-to-the-aether'
      keyAlias project.findProperty('ascentKeyAlias') ?: 'ascent'
      keyPassword project.findProperty('ascentKeyPassword') ?: 'ascent-to-the-aether'
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix ''
      signingConfig signingConfigs.ascent
    }
    release {
      minifyEnabled false
      signingConfig signingConfigs.ascent
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // The game is plain files under assets/www. Nothing may be compressed in a
  // way that stops the WebView reading it, and nothing here needs shrinking.
  androidResources {
    noCompress 'shdr'
  }

  lint {
    abortOnError false
  }
}

dependencies {
  // WebViewAssetLoader. The game is ES modules, and a module script fetched
  // from file:// has an opaque origin, so Chromium blocks it by CORS: the page
  // renders and nothing runs. Serving the same files over an https origin
  // fixes that, and gives localStorage one origin that survives an update.
  implementation 'androidx.webkit:webkit:1.11.0'
}
