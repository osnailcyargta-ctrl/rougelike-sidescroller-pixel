plugins {
  id 'com.android.application'
}

// The build stamps in what it packaged. -PgameVersion / -PgameCode come from
// CI, which derives them from the commit it snapshotted; a local build without
// them still works and says so.
def gameVersion = project.findProperty('gameVersion') ?: 'dev'
def gameCode = (project.findProperty('gameCode') ?: '1') as Integer

android {
  namespace 'com.aetherdescent.game'
  compileSdk 34

  defaultConfig {
    applicationId 'com.aetherdescent.game'
    minSdk 26
    targetSdk 34
    versionCode gameCode
    versionName gameVersion
  }

  buildTypes {
    debug {
      // the debug keystore is generated by Gradle, so this APK installs on a
      // phone without anyone having to hold a signing key
      applicationIdSuffix ''
    }
    release {
      minifyEnabled false
      // signed with the debug key too: an unsigned release APK cannot be
      // installed at all, which would make the artifact useless
      signingConfig signingConfigs.debug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // The game is plain files under assets/www. Nothing may be compressed in a
  // way that stops the WebView reading it, and nothing here needs shrinking.
  androidResources {
    noCompress 'shdr'
  }

  lint {
    abortOnError false
  }
}

dependencies { }
